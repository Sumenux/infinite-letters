<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="style.css"/>
  <title>Infinite letters</title>
</head>
<body>
  <nav>
    <button class="collection-button" id="collection-button" type="button">
      <img class="collection-icon" src="pixel_art/icon_collection.png" alt="Collection">
    </button>
  </nav>
  <div class="page-collection" id="page-collection">
    <div class="page-collection-content">
      <h1>your collection</h1>
      <div class="collection-list" id="collection-list"></div>
    </div>
  </div>
  <div class="scene">
    <div class="letter" id="letter">
      <div class="paper" id="paper">
        <div class="paper-message"></div>
      </div>
      <button class="read-button" id="read-button" type="button">Read</button>
    </div>
    <button class="main-button" id="main-button" type="button">Open it</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
